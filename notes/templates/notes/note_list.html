{% extends 'notes/base.html' %}

{% block content %}

<h2>All My Notes</h2>

<a class="button" href="{% url 'notes:note_create' %}">
    + Create New Note
</a>

<div class="notes-container">

    {% for note in notes %}
        <div class="note-card">

            <h3>{{ note.title }}</h3>

            <p>{{ note.content|truncatewords:20 }}</p>

            <a href="{% url 'notes:note_detail' note.pk %}">
                View Note
            </a>

            <a href="{% url 'notes:note_update' note.pk %}">
                Edit
            </a>

            <a href="{% url 'notes:note_delete' note.pk %}">
                Delete
            </a>

        </div>

    {% empty %}
        <p>You have no notes yet. Create your first note!</p>
    {% endfor %}

</div>

{% endblock %}
