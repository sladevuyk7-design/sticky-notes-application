{% extends 'notes/base.html' %}

{% block content %}

<h2>Delete Sticky Note</h2>

<p>Are you sure you want to delete "{{ note.title }}"?</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

</form>

<a href="{% url 'notes:note_list' %}">Cancel</a>

{% endblock %}
