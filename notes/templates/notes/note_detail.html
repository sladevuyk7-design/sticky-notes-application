{% extends 'notes/base.html' %}

{% block content %}

<div class="note-card">

    <h2>{{ note.title }}</h2>

    <p>{{ note.content|linebreaks }}</p>

    <a href="{% url 'notes:note_update' note.pk %}">Edit Note</a>

    <a href="{% url 'notes:note_delete' note.pk %}">Delete Note</a>

    <a href="{% url 'notes:note_list' %}">Back to Notes</a>

</div>

{% endblock %}
